name: Deploy
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'conexao.php' \
            ./ /var/www/html/
